workflows:
  android-debug:
    name: ANM Meteo v0.4 - Debug APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment: { java: 17 }
    scripts:
      - name: Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Gradle wrapper
        script: gradle wrapper --gradle-version 8.9 && chmod +x gradlew
      - name: Build APK
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
